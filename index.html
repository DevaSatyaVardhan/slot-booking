<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointment Booking</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/timeslots.css">
  <link rel="stylesheet" href="css/registration.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
</head>
<body>
  <div class="container">
    <header>
      <h1>Appointment Booking</h1>
      <div class="progress-bar">
        <div class="progress-step active" id="step-1">
          <div class="step-number">1</div>
          <div class="step-text">Select Date</div>
        </div>
        <div class="progress-connector"></div>
        <div class="progress-step" id="step-2">
          <div class="step-number">2</div>
          <div class="step-text">Choose Time</div>
        </div>
        <div class="progress-connector"></div>
        <div class="progress-step" id="step-3">
          <div class="step-number">3</div>
          <div class="step-text">Register</div>
        </div>
      </div>
    </header>

    <main>
      <!-- Step 1: Calendar View -->
      <section id="calendar-view" class="booking-step active">
        <h2>Select a Date</h2>
        <div class="calendar-container">
          <div class="calendar-header">
            <button id="prev-month" class="calendar-nav-btn">&lt;</button>
            <h3 id="current-month"></h3>
            <button id="next-month" class="calendar-nav-btn">&gt;</button>
          </div>
          <div class="calendar-days">
            <div class="weekday">Sun</div>
            <div class="weekday">Mon</div>
            <div class="weekday">Tue</div>
            <div class="weekday">Wed</div>
            <div class="weekday">Thu</div>
            <div class="weekday">Fri</div>
            <div class="weekday">Sat</div>
          </div>
          <div id="calendar-dates" class="calendar-dates"></div>
        </div>
      </section>

      <!-- Step 2: Time Slot Selection -->
      <section id="timeslot-view" class="booking-step">
        <h2>Select a Time</h2>
        <p id="selected-date-display" class="selected-info"></p>
        <div class="timeslots-container">
          <div class="timeslot-period">
            <h3>Morning</h3>
            <div class="timeslot-grid morning-slots">
              <button class="timeslot-btn" data-time="10:00">10:00 AM</button>
              <button class="timeslot-btn" data-time="11:00">11:00 AM</button>
            </div>
          </div>
          <div class="timeslot-period">
            <h3>Afternoon</h3>
            <div class="timeslot-grid afternoon-slots">
              <button class="timeslot-btn" data-time="12:00">12:00 PM</button>
              <button class="timeslot-btn" data-time="13:00">1:00 PM</button>
              <button class="timeslot-btn" data-time="14:00">2:00 PM</button>
              <button class="timeslot-btn" data-time="15:00">3:00 PM</button>
            </div>
          </div>
          <div class="timeslot-period">
            <h3>Evening</h3>
            <div class="timeslot-grid evening-slots">
              <button class="timeslot-btn" data-time="16:00">4:00 PM</button>
              <button class="timeslot-btn" data-time="17:00">5:00 PM</button>
              <button class="timeslot-btn" data-time="18:00">6:00 PM</button>
            </div>
          </div>
        </div>
        <div class="action-buttons">
          <button id="back-to-calendar" class="secondary-btn">Back</button>
        </div>
      </section>

      <!-- Step 3: Registration Form -->
      <section id="registration-view" class="booking-step">
        <h2>Complete Registration</h2>
        <p id="appointment-info" class="selected-info"></p>
        <form id="registration-form">
          <div class="form-group">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="full-name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>
          </div>
          <div class="form-group">
            <label for="reason">Reason for Appointment</label>
            <textarea id="reason" name="reason" rows="3" required></textarea>
          </div>
          <div class="action-buttons">
            <button type="button" id="back-to-timeslot" class="secondary-btn">Back</button>
            <button type="submit" class="primary-btn">Confirm Booking</button>
          </div>
        </form>
      </section>

      <!-- Confirmation View -->
      <section id="confirmation-view" class="booking-step">
        <div class="confirmation-content">
          <div class="checkmark-circle">
            <div class="checkmark"></div>
          </div>
          <h2>Booking Confirmed!</h2>
          <p id="confirmation-details"></p>
          <button id="new-booking" class="primary-btn">Book Another Appointment</button>
        </div>
      </section>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/timeslots.js"></script>
  <script src="js/registration.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
